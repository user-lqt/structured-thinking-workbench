<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 412" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="validation-evidence-title validation-evidence-desc"><title id="validation-evidence-title">从目标到验证证据的逻辑树</title><desc id="validation-evidence-desc">需求拆为任务交付、权限协作与人员资源三类规则，用非法操作、版本变化和时间冲突等反例检查，再以专项结果和记录支撑结论；离线回归与界面复核补充基础验证。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#587078"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#247F80"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#436B8E"/></marker></defs><rect width="800" height="412" fill="#FFFFFF"/><path d="M 248,74 V 92 Q 248,100 240,100 H 140 Q 132,100 132,108 V 124" fill="none" stroke="#587078" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 400,74 V 124" fill="none" stroke="#587078" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 552,74 V 92 Q 552,100 560,100 H 660 Q 668,100 668,108 V 124" fill="none" stroke="#587078" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 132,212 V 260" fill="none" stroke="#587078" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 400,212 V 260" fill="none" stroke="#587078" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 668,212 V 260" fill="none" stroke="#587078" stroke-width="1.6" marker-end="url(#arrow)"/><g data-node="核心目标具有检查证据"><rect x="220" y="8" width="360" height="66" rx="6" fill="#FFFFFF"/><rect x="220" y="8" width="360" height="66" rx="6" fill="#EEF4F4" stroke="#247F80" stroke-width="1.4"/><text x="400.0" y="31" font-size="19" font-weight="600" fill="#173D45" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">核心目标具有检查证据</text><text x="400.0" y="53" font-size="15" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">需求 → 规则 → 反例检查 → 证据</text></g><g data-node="任务与交付"><rect x="20" y="124" width="224" height="88" rx="6" fill="#FFFFFF"/><rect x="20" y="124" width="224" height="88" rx="6" fill="#FFFFFF" stroke="#173D45" stroke-width="1.4"/><text x="132.0" y="147" font-size="18" font-weight="600" fill="#173D45" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">任务与交付</text><text x="132.0" y="169" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">实名责任、状态与版本</text><text x="132.0" y="187" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">检查无版本及越权验收</text></g><g data-node="权限与协作"><rect x="288" y="124" width="224" height="88" rx="6" fill="#FFFFFF"/><rect x="288" y="124" width="224" height="88" rx="6" fill="#FFFFFF" stroke="#173D45" stroke-width="1.4"/><text x="400.0" y="147" font-size="18" font-weight="600" fill="#173D45" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">权限与协作</text><text x="400.0" y="169" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">邀请、权限与共享修订</text><text x="400.0" y="187" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">检查只读写入及过期保存</text></g><g data-node="人员与资源"><rect x="556" y="124" width="224" height="88" rx="6" fill="#FFFFFF"/><rect x="556" y="124" width="224" height="88" rx="6" fill="#FFFFFF" stroke="#173D45" stroke-width="1.4"/><text x="668.0" y="147" font-size="18" font-weight="600" fill="#173D45" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">人员与资源</text><text x="668.0" y="169" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">资格、班次与资源预留</text><text x="668.0" y="187" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">检查时间冲突及容量不足</text></g><g data-node="关联接口 · 56 项"><rect x="20" y="260" width="224" height="88" rx="6" fill="#FFFFFF"/><rect x="20" y="260" width="224" height="88" rx="6" fill="#F0F4F4" stroke="#587078" stroke-width="1.4"/><text x="132.0" y="283" font-size="17" font-weight="600" fill="#173D45" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">关联接口 · 56 项</text><text x="132.0" y="305" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">验收引用保留原版本</text><text x="132.0" y="323" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">缺责任或版本的提交被拒</text></g><g data-node="共享集成 · 82 项"><rect x="288" y="260" width="224" height="88" rx="6" fill="#FFFFFF"/><rect x="288" y="260" width="224" height="88" rx="6" fill="#F0F4F4" stroke="#587078" stroke-width="1.4"/><text x="400.0" y="283" font-size="17" font-weight="600" fill="#173D45" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">共享集成 · 82 项</text><text x="400.0" y="305" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">草稿保留并提示冲突</text><text x="400.0" y="323" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">邀请角色决定读写范围</text></g><g data-node="人员考勤 · 88 项"><rect x="556" y="260" width="224" height="88" rx="6" fill="#FFFFFF"/><rect x="556" y="260" width="224" height="88" rx="6" fill="#F0F4F4" stroke="#587078" stroke-width="1.4"/><text x="668.0" y="283" font-size="17" font-weight="600" fill="#173D45" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">人员考勤 · 88 项</text><text x="668.0" y="305" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">多人安排整组校验</text><text x="668.0" y="323" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">签到、报告与工时分别留档</text></g><line x1="20" y1="374" x2="780" y2="374" stroke="#CAD8DA"/><text x="400" y="399" font-size="15" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">基础回归覆盖 38 个模块、1044 项断言；界面操作另以独立浏览器会话核对</text></svg>
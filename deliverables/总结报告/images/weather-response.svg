<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 408" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="weather-response-title weather-response-desc"><title id="weather-response-title">天气变更的风险识别、分级与处置</title><desc id="weather-response-desc">示例项目中的天气风险评分为4乘4等于16，前置跟踪与备用准备、总协调决策、宣传后勤执行协同转场，再复核留档；转场安全问题升级到高风险处置。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#587078"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#247F80"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#436B8E"/></marker></defs><rect width="800" height="408" fill="#FFFFFF"/><path d="M 256,178 H 288" fill="none" stroke="#587078" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 512,178 H 544" fill="none" stroke="#587078" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M 656,222 V 268" fill="none" stroke="#247F80" stroke-width="1.6" marker-end="url(#arrow-accent)"/><rect x="32" y="8" width="736" height="78" rx="6" fill="#EEF4F4" stroke="#247F80" stroke-width="1.4"/><text x="400" y="35" font-size="19" font-weight="600" fill="#173D45" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">天气风险：可能性 4 × 影响 4 = 16（高风险）</text><text x="400" y="61" font-size="15" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">触发条件：降雨、大风或气温骤降，户外展区无法正常开放</text><g data-node="跟踪与准备"><rect x="32" y="134" width="224" height="88" rx="6" fill="#FFFFFF"/><rect x="32" y="134" width="224" height="88" rx="6" fill="#FFFFFF" stroke="#173D45" stroke-width="1.4"/><text x="144.0" y="157" font-size="18" font-weight="600" fill="#173D45" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">跟踪与准备</text><text x="144.0" y="179" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">提前 48 小时关注天气</text><text x="144.0" y="197" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">准备备用场地与搬运人力</text></g><g data-node="总协调决定转场"><rect x="288" y="134" width="224" height="88" rx="6" fill="#FFFFFF"/><rect x="288" y="134" width="224" height="88" rx="6" fill="#EEF4F4" stroke="#247F80" stroke-width="1.4"/><text x="400.0" y="157" font-size="18" font-weight="600" fill="#173D45" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">总协调决定转场</text><text x="400.0" y="179" font-size="15" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">活动前一天 18:00 前确认</text><text x="400.0" y="197" font-size="15" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">是否启用体育馆副馆</text></g><g data-node="三组协同执行"><rect x="544" y="134" width="224" height="88" rx="6" fill="#FFFFFF"/><rect x="544" y="134" width="224" height="88" rx="6" fill="#FFFFFF" stroke="#173D45" stroke-width="1.4"/><text x="656.0" y="157" font-size="18" font-weight="600" fill="#173D45" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">三组协同执行</text><text x="656.0" y="179" font-size="15" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">宣传更新、后勤搬运</text><text x="656.0" y="197" font-size="15" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">执行组引导人流改道</text></g><g data-node="检查与复盘"><rect x="544" y="268" width="224" height="78" rx="6" fill="#FFFFFF"/><rect x="544" y="268" width="224" height="78" rx="6" fill="#F0F4F4" stroke="#587078" stroke-width="1.4"/><text x="656.0" y="291" font-size="18" font-weight="600" fill="#173D45" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">检查与复盘</text><text x="656.0" y="313" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">核对场地、通知与动线</text><text x="656.0" y="331" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">记录处置和改进行动</text></g><text x="32" y="288" font-size="16" font-weight="600" fill="#173D45" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif">升级条件</text><text x="32" y="314" font-size="15" font-weight="400" fill="#587078" text-anchor="start" font-family="Microsoft YaHei, SimHei, sans-serif">转场出现安全风险 → 按高风险流程处置</text><line x1="32" y1="368" x2="768" y2="368" stroke="#CAD8DA"/><text x="400" y="391" font-size="14" font-weight="400" fill="#587078" text-anchor="middle" font-family="Microsoft YaHei, SimHei, sans-serif">评分用于安排处置优先级；准备条件、行动责任与复核记录共同支撑应急决策</text></svg>